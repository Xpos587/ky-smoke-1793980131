name: keyrelay uname

on:
  workflow_dispatch:
    inputs:
      job_id: {required: true}
      # Empty for a repo source: the fetch step branches on $REPO, and GitHub
      # rejects an omitted required input with 422 (§5).
      source_url: {required: false, default: ""}
      repo: {required: false, default: ""}
      ref: {required: false, default: ""}
      env_json: {required: false, default: "{}"}
      worktree_dir: {required: false, default: ""}
      artifact_globs: {required: false, default: "uname.txt"}
      artifact_cap: {required: false, default: "10"}
      runner_label: {required: false, default: "ubuntu-24.04"}
      max_minutes: {required: false, default: "10"}

permissions:
  contents: read

concurrency: keyrelay-${{ inputs.job_id }}
run-name: ky-${{ inputs.job_id }}

jobs:
  build:
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: ${{ fromJSON(inputs.max_minutes) }}
    steps:
      # The source is validated while it is unpacked: absolute paths, "..",
      # escaping symlinks and entry/size caps, before any build step runs (§7).
      - name: fetch source
        env:
          SOURCE_URL: ${{ inputs.source_url }}
          REPO: ${{ inputs.repo }}
          REF: ${{ inputs.ref }}
          TOKEN: ${{ github.token }}
        run: |
          mkdir -p work
          if [ -n "$REPO" ]; then
            git init -q work && cd work
            # x-access-token: the run's own contents:read GITHUB_TOKEN. A public
            # repo does not need it, but a private one the token can read works
            # too, and an unauthenticated fetch failed with a bare 128.
            git remote add origin "https://x-access-token:$TOKEN@github.com/$REPO.git"
            git fetch -q --depth 1 origin "$REF"
            git checkout -q FETCH_HEAD
            exit 0
          fi
          curl -fsSL --max-time 180 "$SOURCE_URL" -o src.tar
          python3 - <<'PY'
          import os, posixpath, sys, tarfile, pathlib
          dest = pathlib.Path("work"); dest.mkdir(exist_ok=True)
          entries = inflated = 0
          with tarfile.open("src.tar") as t:
              for m in t:
                  entries += 1
                  if entries > 20000:
                      sys.exit("too many entries")
                  p = pathlib.PurePosixPath(m.name)
                  if p.is_absolute() or ".." in p.parts:
                      sys.exit(f"bad path {m.name}")
                  target = dest.joinpath(*p.parts)
                  if m.isdir():
                      target.mkdir(parents=True, exist_ok=True)
                  elif m.issym() or m.islnk():
                      # A symlink target is relative to its own directory, an
                      # archive-root-relative hardlink to the tree root. Both are
                      # normalised, so "sub/../x" stays legal and only a path
                      # climbing out of the tree is refused.
                      link = pathlib.PurePosixPath(m.linkname)
                      base = p.parent if m.issym() else pathlib.PurePosixPath()
                      if link.is_absolute():
                          sys.exit(f"link {m.name} is absolute")
                      resolved = posixpath.normpath(base / link)
                      if resolved == ".." or resolved.startswith("../"):
                          sys.exit(f"link {m.name} escapes the tree")
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.unlink(missing_ok=True)
                      target.symlink_to(os.path.relpath(resolved, str(p.parent)))
                  elif m.isfile():
                      if m.size > 64 << 20:
                          sys.exit(f"{m.name} exceeds the file cap")
                      inflated += m.size
                      if inflated > 500 << 20:
                          sys.exit("archive inflates past the cap")
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with t.extractfile(m) as src, open(target, "wb") as out:
                          while chunk := src.read(1 << 20):
                              out.write(chunk)
                      os.chmod(target, (m.mode & 0o777) or 0o644)
          PY
      # Caller env is applied process-scoped, never through $GITHUB_ENV (§8).
      # NUL-separated, so a newline in a value survives untouched.
      - name: build
        working-directory: work
        env:
          ENV_JSON: ${{ inputs.env_json }}
        run: |
          mapfile -d '' -t pairs < <(printf '%s' "$ENV_JSON" | python3 -c '
          import json, sys
          for k, v in json.load(sys.stdin).items(): sys.stdout.write(f"{k}={v}\0")
          ')
          # `xargs bash -c '"$@"' -- CMD...` makes the first argument the command,
          # so a bare `'>'` word would be swallowed: the redirect needs its own sh.
          printf '%s\0' sh -c 'uname -a > uname.txt' > args.nul
          env "${pairs[@]}" xargs -0 -a args.nul bash -c '"$@"' --
      # The reservation must bound the upload, so the selection is measured
      # before GitHub storage is spent (§8). The same step emits the uploader's
      # path list, so what is counted is exactly what is uploaded: a `uses` step
      # takes no working-directory, and a multi-line path input gets no prefix of
      # its own.
      - name: cap artifacts
        id: cap
        if: always()
        working-directory: work
        env:
          GLOBS: ${{ inputs.artifact_globs }}
          CAP: ${{ inputs.artifact_cap }}
        run: |
          python3 - <<'PY'
          import glob, os, re, sys

          # The uploader globs its path input, so a matched name must be escaped
          # or a literal "[ab].apk" would select a/b.apk, which the cap step never
          # measured. Same algorithm as @actions/glob's globEscape.
          def glob_escape(p):
              p = p.replace("\\", "\\\\")
              p = re.sub(r"(\[)(?=[^/]+\])", r"[[]", p)
              return p.replace("?", "[?]").replace("*", "[*]")
          patterns = [g for g in os.environ["GLOBS"].splitlines() if g.strip()]
          files = sorted({f for p in patterns for f in glob.glob(p, recursive=True) if os.path.isfile(f)})
          cap = int(float(os.environ["CAP"]) * (1 << 20))
          total = sum(os.path.getsize(f) for f in files)
          if len(files) > 200:
              sys.exit(f"{len(files)} files exceed the 200 cap")
          if total > cap:
              sys.exit(f"{total >> 20} MiB exceeds the {os.environ['CAP']} MiB reservation")
          ws = os.environ["GITHUB_WORKSPACE"]
          prefix = os.path.relpath(os.getcwd(), ws)
          for f in files:
              if "\n" in f or "\r" in f:
                  sys.exit(f"newline in a file name: {f!r}")
          with open(os.path.join(ws, "artifact_paths.txt"), "w") as out:
              out.writelines(glob_escape(os.path.normpath(os.path.join(prefix, f))) + "\n" for f in files)
          print(f"{len(files)} file(s), {total} bytes")
          PY
          {
            echo 'paths<<__EOF__'
            cat "$GITHUB_WORKSPACE/artifact_paths.txt"
            echo '__EOF__'
          } >> "$GITHUB_OUTPUT"
      # An empty list is a required input of the action, so it has to be skipped
      # rather than passed through: a build whose selectors match nothing is
      # still a success with zero artifacts (§8).
      - uses: actions/upload-artifact@v5
        if: ${{ success() && steps.cap.outputs.paths != '' }}
        with:
          name: result
          path: ${{ steps.cap.outputs.paths }}
          retention-days: 1
